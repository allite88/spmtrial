<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — __SITE_NAME__</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#15181e;--mut:#5e6673;--line:#e2e5ea;--brand:#0f766e;--warn:#b45309;--ok:#15803d;--err:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}header .sp{flex:1}
.wrap{padding:12px 16px;max-width:1500px;margin:0 auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit}input[type=text],input[type=search],input[type=url],input[type=password],select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
input[type=search]{flex:1 1 260px}
button{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
.muted{color:var(--mut);font-size:12.5px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:#f0f2f5;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
td.lab b{display:block}td.lab small{color:var(--mut)}
.c{display:inline-block;margin:2px 4px 2px 0;padding:3px 8px;border-radius:6px;font-size:12.5px;text-decoration:none}
.c-paper{background:#eaf0fe;color:#1d4ed8}.c-ans{background:#e8f6ec;color:#15803d}.c-quiz{background:#f1ebfe;color:#7c3aed}.c-doc{background:#eef0f3;color:#374151}
.c-allite{background:#fff4e6;color:#c2410c;font-weight:600}
td.q input{width:100%;min-width:220px;margin-bottom:5px}
tr.dirty td{background:#fffbeb}tr.has td.q input{border-color:#fdba74}
.src{font-size:11.5px;color:var(--mut);word-break:break-all}
#status{font-weight:600}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef0f3;font-size:12px;margin-left:4px}
@media (max-width:800px){th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>
<header>
  <h1>⚙️ Admin __SITE_NAME__</h1>
  <span class="muted" id="counts"></span>
  <span class="sp"></span>
  <span id="status" class="muted"></span>
  <button class="pri" id="save" disabled>Simpan (0)</button>
</header>
<div class="wrap">
  <div class="box" id="tokbox">
    <b>Kunci GitHub</b> <span class="muted">— diperlukan untuk menyimpan. Disimpan dalam pelayar ini sahaja.</span><br>
    <div class="filters" style="margin-top:8px">
      <input type="password" id="tok" placeholder="github_pat_…" style="flex:1 1 320px">
      <button id="tokset">Guna kunci</button><button id="tokclear">Padam kunci</button>
      <span id="tokstate" class="muted"></span>
    </div>
  </div>
  <div class="box filters">
    <select id="fsub"><option value="">Semua subjek</option></select>
    <select id="ftyp"></select>
    <select id="fyear"><option value="">Semua tahun</option></select>
    <select id="fstate"><option value="">Semua negeri</option></select>
    <input type="search" id="fq" placeholder="Cari: johor, kertas 2, bab 3, url…">
    <label class="muted"><input type="checkbox" id="fhas"> Ada quiz Allite sahaja</label>
    <label class="muted"><input type="checkbox" id="fno"> Belum ada quiz sahaja</label>
    <button id="csv">Muat turun CSV</button>
  </div>
  <p class="muted" id="info"></p>
  <table>
    <thead><tr><th style="width:22%">Baris (seperti di laman)</th><th>Butang di laman (pautan asal)</th><th style="width:26%">Allite Online Quiz</th><th style="width:16%">Halaman sumber</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <p class="muted" id="more"></p>
</div>
<script>
window.ADMIN_CFG = __CFG__;
</script>
<script src="admin.js"></script>
</body>
</html>
